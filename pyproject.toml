[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "jaz"
version = "0.2.0a1"
description = "JAZ: The language of building and optimizing LLM-agents"
authors = [
    { name = "Zhening Li", email = "zli11010@mit.edu" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0.0",
    "beartype>=0.18.0",
    "typing-extensions>=4.13.0",
    "pathspec>=0.12",
]

[project.scripts]
jaz = "jaz.console:main"

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/jaz-lang/jaz"

[tool.setuptools.package-data]
jaz = [
    "templates/*.jinja2",
    "providers/*.json",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call real external APIs (skipped in CI by default)",
    "needs_heavy_deps: tests needing optional heavy deps (mem0/letta/datasets/docker); guard imports with pytest.importorskip and skip unless installed",
    "real_sandbox_defaults: run under the production sandbox defaults (allowed_imports=[] deny-all); opts out of the conftest autouse fixture that unrestricts imports for other tests (#723 follow-up)",
    "no_api_key: an `integration`-marked test that needs no API key (e.g. it renders prompts locally); opts out of the suite's OPENAI_API_KEY skip fixture",
]
timeout = 30
timeout_method = "thread"
