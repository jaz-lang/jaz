[build-system]
requires = [
    "setuptools>=77.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "jaz"
version = "0.1.1"
description = "JAZ: The language of building and optimizing LLM-agents"
authors = [
    { name = "Zhening Li", email = "zli11010@mit.edu" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "beartype>=0.18.0",
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/jaz-lang/jaz"

[tool.setuptools.package-data]
jaz = [
    "templates/*.jinja2",
    "providers/*.json",
]
